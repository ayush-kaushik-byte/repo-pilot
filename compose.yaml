services:
  repopilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: repopilot:local
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
